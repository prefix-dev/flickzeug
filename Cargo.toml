[package]
name = "flickzeug"
version = "0.5.4"
authors = ["prefix.dev <hi@prefix.dev>"]
license = "MIT OR Apache-2.0"
description = "A fork of diffy: diff, patch, and merge library featuring Myers' algorithm, unified diff format parsing, fuzzy patch application, and three-way merge with conflict detection"
documentation = "https://docs.rs/flickzeug"
repository = "https://github.com/prefix-dev/flickzeug"
readme = "README.md"
keywords = ["diff", "patch", "merge"]
categories = ["text-processing"]
rust-version = "1.88"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
memchr = "2.7"
nu-ansi-term = { version = "0.50", optional = true }
strsim = "0.11.1"
thiserror = "2.0.12"

[dev-dependencies]
insta = { version = "1.43.1", features = ["glob"] }
rstest = "0.26.1"

[features]
default = ["color"]
## Colored patch formatting (PatchFormatter::with_color)
color = ["dep:nu-ansi-term"]
## Build the `flickzeug` command line tool (diff / apply / merge)
cli = ["dep:clap", "color"]

[[bin]]
name = "flickzeug"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]
